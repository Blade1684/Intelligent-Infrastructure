events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        resolver 127.0.0.11 valid=5s ipv6=off;

        location /api/monitor/ {
            proxy_pass http://monitor:5001/;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        location /api/app1/ {
            proxy_pass http://app1:5000/;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        location /api/app2/ {
            proxy_pass http://app2:5000/;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        location /api/app3/ {
            proxy_pass http://app3:5000/;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        location /api/app4/ {
            proxy_pass http://app4:5000/;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        location /api/app5/ {
            proxy_pass http://app5:5000/;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        location /api/gateway/ {
            proxy_pass http://haproxy:80/;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        location = /api/gateway {
            proxy_pass http://haproxy:80/;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        location /api/haproxy/ {
            proxy_pass http://haproxy:8404/;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}

