services:
  monitor:
    build: ./monitor
    ports:
      - "5001:5001"
    environment:
      LATENCY_THRESHOLD_MS: "500.0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./monitor/monitor.py:/monitor/monitor.py
      - ./monitor/detector.py:/monitor/detector.py
      - ./monitor/recovery.py:/monitor/recovery.py
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - infrastructure-network

  app1:
    build: ./app
    ports:
      - "5002:5000"
    environment:
      SERVER_NAME: "Server-1"
      REDIS_HOST: "redis"
      SECRET_KEY: "shared-development-secret"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - infrastructure-network

  app2:
    build: ./app
    ports:
      - "5003:5000"
    environment:
      SERVER_NAME: "Server-2"
      REDIS_HOST: "redis"
      SECRET_KEY: "shared-development-secret"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - infrastructure-network

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - infrastructure-network

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
    networks:
      - infrastructure-network

  dashboard:
    build: ./dashboard
    ports:
      - "8500:80"
    volumes:
      - ./dashboard/index.html:/usr/share/nginx/html/index.html:ro
      - ./dashboard/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      monitor:
        condition: service_started
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
    networks:
      - infrastructure-network

networks:
  infrastructure-network:
    driver: bridge
