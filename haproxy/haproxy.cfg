global
    log stdout format raw local0
    maxconn 2048
    stats socket /tmp/haproxy.sock mode 600 level admin
    stats timeout 30s

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 3s
    timeout client 30s
    timeout server 30s
    retries 2

resolvers docker_dns
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout retry 1s
    hold valid 2s
    hold other 2s
    hold refused 2s
    hold nx 2s
    hold timeout 2s
    hold obsolete 2s

frontend http_front
    bind *:80
    default_backend app_cluster

backend app_cluster
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 check resolvers docker_dns init-addr libc,none
    server app1 app1:5000 check
    server app2 app2:5000 check
    server app3 app3:5000 check
    server app4 app4:5000 check
    server app5 app5:5000 check

frontend stats_front
    bind *:8404
    mode http
    stats enable
    stats uri /
    stats refresh 2s
    stats show-legends
    stats show-node
    stats auth admin:admin_infrastructure_secret
