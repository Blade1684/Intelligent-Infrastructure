events {}

http {

    server {

        listen 80;


        # ----------------------------------------------------
        # DOCKER DNS RESOLVER
        #
        # 127.0.0.11 is Docker's embedded DNS.  valid=10s
        # discards cached addresses after 10 seconds so NGINX
        # always has the current IP for a recreated container.
        # ----------------------------------------------------

        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 2s;


        # ----------------------------------------------------
        # PRIMARY LOCATION
        # ----------------------------------------------------

        location / {

            # Variable-based proxy_pass forces NGINX to call
            # the resolver at request time rather than once at
            # startup.  This is required for Docker DNS to work
            # correctly after container restarts.

            set $upstream_app1 app1:5000;


            # ------------------------------------------------
            # PROXY TIMEOUTS
            #
            # Short connect timeout so a stopped container is
            # detected quickly and error_page can fire.
            # ------------------------------------------------

            proxy_connect_timeout 3s;
            proxy_read_timeout    30s;
            proxy_send_timeout    10s;


            # ------------------------------------------------
            # REQUEST HEADERS
            # ------------------------------------------------

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;


            # ------------------------------------------------
            # PROXY PASS AND FAILOVER
            #
            # NOTE: proxy_next_upstream is intentionally absent.
            # proxy_next_upstream only works with upstream groups,
            # not with variable-based proxy_pass.  When both are
            # present, proxy_next_upstream exhausts its own retry
            # loop and emits a final 502 *before* error_page has
            # a chance to fire, making the fallback unreachable.
            #
            # error_page is the correct and sole failover
            # mechanism when proxy_pass uses a variable.
            # ------------------------------------------------

            proxy_pass http://$upstream_app1;

            error_page 502 503 504 = @fallback_app2;

        }


        # ----------------------------------------------------
        # FALLBACK LOCATION
        #
        # Reached only when the primary (app1) is unreachable.
        # Uses its own set directive so Docker DNS re-resolves
        # app2 independently of app1.
        # ----------------------------------------------------

        location @fallback_app2 {

            set $upstream_app2 app2:5000;

            proxy_connect_timeout 3s;
            proxy_read_timeout    30s;
            proxy_send_timeout    10s;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_pass http://$upstream_app2;

        }

    }

}